
  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Google Sheet Rows</title>
    
    <style>
        body { 
            text-align: center; 
            padding: 20px;  
            --accent: #006600;
            background-color: #d9ffcc;
            font-family: Georgia, serif; 
            margin: 30px; 
        }
        .search-box { 
        background: transparent; 
            margin-bottom: 20px; 
        }
        input { 
        background: transparent; 
            padding: 8px; 
            width: 250px; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
        background: transparent; 
            padding: 8px 15px; 
            cursor: pointer; 
        }
        #data-container { 
        background: transparent; 
            margin: 20px auto; 
            padding: 15px; 
            border: 1px solid #ccc; 
            max-width: 400px; 
            background: #d9ffcc;
            border-radius: 8px;
        }
        .card { 
            background: transparent; 
            max-width: 400px; 
            margin: 0 auto 20px auto; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-bottom: 4px solid var(--accent); 
        }
        h1 {
            font-family: Georgia, serif;
            letter-spacing: 5px;
            font-size: 30px; 
            font-weight: 300; 
        }
        p {
            font-family: Georgia, serif;
            font-size: 11px;
        }
       
    </style>
</head>
<body>

    <!-- Changed id="card" to class="card" to match your CSS -->
    <div class="card"> 
        <h1>Base de Datos de Alimentos </h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe bien el alimento">
            <button onclick="executeSearch()">Buscar</button>
        </div>

        <div id="data-container">Tu resultado aparecerá aquí</div>
    </div>
    
    <div>
        <button onclick="window.location.href='Nutrición.html';" class="start-btn">
            INICIO
        </button>
    </div>




    <script>
        // Replace with your freshly deployed Google Apps Script Web App URL
        const baseApiUrl = 'https://script.google.com/macros/s/AKfycbymu5IiM18aAoShh-lMi2QSOQ3Hn-88YEDVGXZ3E0yx36fwM3ZsI7yrE0hds_pAdyXV9w/exec'; 

        async function executeSearch() {
            const inputVal = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('data-container');
            
            if (!inputVal) {
                container.innerText = "Please enter a value to search.";
                return;
            }

            container.innerText = "Searching...";
            let finalUrl = baseApiUrl;

            // If input is purely a number, append row parameter. Otherwise, append search parameter.
            if (!isNaN(inputVal)) {
                finalUrl += `?row=${inputVal}`;
            } else {
                finalUrl += `?search=${encodeURIComponent(inputVal)}`;
            }

            try {
                const response = await fetch(finalUrl);
                const data = await response.json();
                
                if (data.error) {
                    container.innerText = data.error;
                    return;
                }

                // Render matching data rows
                let htmlContent = '<h3>Match Found:</h3><ul>';
                for (const [key, value] of Object.entries(data)) {
                    htmlContent += `<li><strong>${key}:</strong> ${value}</li>`;
                }
                htmlContent += '</ul>';

                container.innerHTML = htmlContent;
            } catch (error) {
                container.innerText = 'Error connection to database.';
                console.error(error);
            }
        }
    </script>
</body>
</html>
