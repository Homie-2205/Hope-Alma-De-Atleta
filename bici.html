<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Run Tracker</title>
    <style>


        /* --- General Layout --- */
        body {
            font-family: 'Segoe UI', Georgia, serif;
            background-image: url('Canada.jpeg');
            background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
            background-repeat: no-repeat;
            color: black;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            --accent: #ff3300;
        }

        /* --- Shared Components --- */
        input { 
            background: rgba(255, 255, 255, 0.1); 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }

        button { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            transition: 0.3s; 
        }

        .start, .stop { 
            background: #ff3300; 
            color: black; 
        }

        /* --- Music Player Styles --- */
        .app {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .times { display: flex; justify-content: space-between; color: #a1a1aa; font-size: 12px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 22px; margin: 25px 0; }
        
        .btn { 
            border: 0; 
            background: #27272a; 
            color: #fff; 
            border-radius: 50%;
            width: 52px; 
            height: 52px; 
            font-size: 21px; 
        }

        .play { width: 68px; height: 68px; background: #fff; color: #09090b; font-size: 28px; }
        
        .action { 
            width: 100%; 
            padding: 14px; 
            border: 0; 
            border-radius: 12px; 
            background: #27272a; 
            color: #fff; 
            font-size: 16px; 
            margin-bottom: 12px; 
        }

        .playlist { margin-top: 20px; text-align: left; }
        .song { padding: 14px; border-bottom: 1px solid #27272a; cursor: pointer; }
        .song small { color: #a1a1aa; }
        #file { display: none; } /* Kept hidden for customized button click */

        /* --- Run Tracker Card Styles --- */
        .card { 
            background: rgba(255, 255, 255, 0.85); 
            width: 100%;
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-bottom: 4px solid var(--accent); 
            box-sizing: border-box;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { background: rgba(0, 0, 0, 0.05); padding: 15px; border-radius: 10px; }
        .stat-value { font-size: 1.5em; font-weight: bold; display: block; color: #000000; }

        /* --- Map Styles --- */
        #map {
            height: 300px;
            width: 100%;
            max-width: 400px;
            background: #000; 
            border: 2px solid #ff3333; 
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 
                0 0 5px #fff,            
                0 0 10px #fff,           
                0 0 20px #ff3333,           
                0 0 40px #ff3333,           
                0 0 80px #ff3333;           
        }
    </style>
    
</head>
<body>



      <div class="app">
        <h1>🎵 Music Player</h1>
        <div class="cover">♫</div>
        <div class="title" id="title">No song selected</div>
        <div class="artist">WebView Music Player</div>
        <div class="bar">

        </div>
        <button class="action" onclick="chooseMusic()">📁 Add music from phone</button>
        <input id="file" type="file" accept="audio/*" multiple>
        <div class="playlist" id="playlist"></div>
    </div>
<div class="card">
    <h2>Bicicleta Fitness</h2>

    <!-- User Input for Weight -->
    <div class="input-group">
        <label for="weight">Tu Peso (kg):</label>
        <input type="number" id="weight" value="70" placeholder="Enter weight in kg">
    </div>

    <div class="stats">
        <div class="stat-item">
            <span class="stat-value" id="distText">0.00</span>
            <small>KM</small>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="calText">0</span>
            <small>KCAL</small>
        </div>
        <div class="stat-item" style="grid-column: span 2;">
            <span class="stat-value" id="timeText">00:00:00</span>
            <small>DURACION</small>
        </div>
    </div>

    <button id="mainBtn" class="start">EMPEZAR</button>
</div>

<style>

     height: 300px;

<body>


<div id="map"></div>

<script>
  function initMap() {

      zoom: 10,

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDdEe6Oo2S5kepkqBudFAR4aCL69NXN_g&callback=initMap" async defer></script>





    
<script>
        let songs=[], index=-1, playing=false, audio=new Audio();
        const playlist = document.getElementById('playlist');
        const title = document.getElementById('title');
        const play = document.getElementById('play');
        const progress = document.getElementById('progress');
        const current = document.getElementById('current');
        const duration = document.getElementById('duration');

        function chooseMusic(){
            if(window.Android){ Android.requestPermission(); }
            document.getElementById('file').click();
        }

        document.getElementById('file').onchange=e=>{
            songs=[...e.target.files].map(f=>({file:f,url:URL.createObjectURL(f),name:f.name}));
            render(); 
            if(songs.length) load(0);
        };

        function render(){
            playlist.innerHTML=songs.map((s,i)=>`<div class="song" onclick="load(${i})">🎵 ${escapeHtml(s.name)}<br><small>Tap to play</small></div>`).join('');
        }

        function escapeHtml(s){
            return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
        }

        function load(i){
            if(!songs[i])return; 
            index=i; 
            title.textContent=songs[i].name; 
            audio.src=songs[i].url; 
            audio.load(); 
            audio.play();
            playing=true; 
            play.textContent='⏸';
            if(window.Android) Android.play(songs[i].url,songs[i].name);
        }

        function toggle(){
            if(index<0){chooseMusic();return}
            if(playing){
                audio.pause(); 
                if(window.Android)Android.pause();
                play.textContent='▶';
                playing=false;
            } else {
                audio.play();
                if(window.Android)Android.resume();
                play.textContent='⏸';
                playing=true;
            }
        }

        function previous(){ if(index>0) load(index-1); }
        function next(){ if(index<songs.length-1) load(index+1); }

        audio.ontimeupdate=()=>{
            if(audio.duration){progress.value=audio.currentTime/audio.duration*100}
            current.textContent=time(audio.currentTime);
            duration.textContent=time(audio.duration);
        }

        progress.oninput=()=>{
            if(audio.duration){
                let s=progress.value/100*audio.duration;
                audio.currentTime=s;
                if(window.Android)Android.seek(s);
            }
        }

        audio.onended=()=>next();

        function time(s){
            if(!isFinite(s))return'0:00';
            s=Math.floor(s);
            return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
        }

        window.onAndroidPermission=granted=>{
            if(!granted) alert('Storage/audio permission was denied.');
        }
        window.androidReady=()=>{};
    </script>





<script>


  

         
    let isTracking = false;
    let watchId = null;
    let distance = 0;
    let lastPos = null;
    let startTime = null; // Tracks exactly when the run started
    let timerId = null;

    const btn = document.getElementById('mainBtn');
    const weightInput = document.getElementById('weight');

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateStats() {
        if (!isTracking) return;

        const userWeight = parseFloat(weightInput.value) || 70;
        const now = Date.now();
        
        // 1. ACTIVE CALORIES (Distance-based)
        const activeCals = distance * userWeight * 0.5;

        // 2. REST CALORIES (Time-based Fix for APK)
        // Instead of a timer, we see how many minutes have passed since 'startTime'
        // This works even if the phone was locked/sleeping!
        const elapsedMinutes = (now - startTime) / 60000;
        const restCals = elapsedMinutes * 1; // 1 kcal per minute

        const totalCals = activeCals + restCals;

        document.getElementById('distText').innerText = distance.toFixed(2);
        document.getElementById('calText').innerText = Math.round(totalCals);
    }

    btn.addEventListener('click', () => {
        if (!isTracking) {
            isTracking = true;
            btn.innerText = "PARAR";
            btn.className = "stop";
            weightInput.disabled = true;
            
            // Capture the exact moment we start
            startTime = Date.now();
            distance = 0;

            // GPS TRACKING
            watchId = navigator.geolocation.watchPosition(p => {
                const { latitude, longitude } = p.coords;
                if (lastPos) {
                   const d = getDistance(lastPos.lat, lastPos.lon, latitude, longitude);
                   if (d > 0.003) { // 3 meters threshold
                       distance += d;
                       updateStats();
                   }
                }
                lastPos = { lat: latitude, lon: longitude };
            }, e => alert("Activa el GPS"), { enableHighAccuracy: true });

            // UI REFRESH TIMER (Updates every second)
            timerId = setInterval(() => {
                const now = Date.now();
                const diff = now - startTime;
                
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                
                document.getElementById('timeText').innerText = `${h}:${m}:${s}`;
                
                // Update calories every second based on current time
                updateStats();
            }, 1000);

        } else {
            isTracking = false;
            btn.innerText = "EMPEZAR";
            btn.className = "start";
            weightInput.disabled = false;
            navigator.geolocation.clearWatch(watchId);
            clearInterval(timerId);
            lastPos = null;
        }
    });


</script>
<script>
