<script>
        let songs=[], index=-1, playing=false, audio=new Audio();
        const playlist = document.getElementById('playlist');
        const title = document.getElementById('title');
        const play = document.getElementById('play');
        const progress = document.getElementById('progress');
        const current = document.getElementById('current');
        const duration = document.getElementById('duration');

        function chooseMusic(){
            if(window.Android){ Android.requestPermission(); }
            document.getElementById('file').click();
        }

        document.getElementById('file').onchange=e=>{
            songs=[...e.target.files].map(f=>({file:f,url:URL.createObjectURL(f),name:f.name}));
            render(); 
            if(songs.length) load(0);
        };

        function render(){
            playlist.innerHTML=songs.map((s,i)=>`<div class="song" onclick="load(${i})">🎵 ${escapeHtml(s.name)}<br><small>Tap to play</small></div>`).join('');
        }

        function escapeHtml(s){
            return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
        }

        function load(i){
            if(!songs[i])return; 
            index=i; 
            title.textContent=songs[i].name; 
            audio.src=songs[i].url; 
            audio.load(); 
            audio.play();
            playing=true; 
            play.textContent='⏸';
            if(window.Android) Android.play(songs[i].url,songs[i].name);
        }

        function toggle(){
            if(index<0){chooseMusic();return}
            if(playing){
                audio.pause(); 
                if(window.Android)Android.pause();
                play.textContent='▶';
                playing=false;
            } else {
                audio.play();
                if(window.Android)Android.resume();
                play.textContent='⏸';
                playing=true;
            }
        }

        function previous(){ if(index>0) load(index-1); }
        function next(){ if(index<songs.length-1) load(index+1); }

        audio.ontimeupdate=()=>{
            if(audio.duration){progress.value=audio.currentTime/audio.duration*100}
            current.textContent=time(audio.currentTime);
            duration.textContent=time(audio.duration);
        }

        progress.oninput=()=>{
            if(audio.duration){
                let s=progress.value/100*audio.duration;
                audio.currentTime=s;
                if(window.Android)Android.seek(s);
            }
        }

        audio.onended=()=>next();

        function time(s){
            if(!isFinite(s))return'0:00';
            s=Math.floor(s);
            return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
        }

        window.onAndroidPermission=granted=>{
            if(!granted) alert('Storage/audio permission was denied.');
        }
        window.androidReady=()=>{};
    </script>




<script>


  

         
    let isTracking = false;
    let watchId = null;
    let distance = 0;
    let lastPos = null;
    let startTime = null; // Tracks exactly when the run started
    let timerId = null;

    const btn = document.getElementById('mainBtn');
    const weightInput = document.getElementById('weight');

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateStats() {
        if (!isTracking) return;

        const userWeight = parseFloat(weightInput.value) || 70;
        const now = Date.now();
        
        // 1. ACTIVE CALORIES (Distance-based)
        const activeCals = distance * userWeight * 0.5;

        // 2. REST CALORIES (Time-based Fix for APK)
        // Instead of a timer, we see how many minutes have passed since 'startTime'
        // This works even if the phone was locked/sleeping!
        const elapsedMinutes = (now - startTime) / 60000;
        const restCals = elapsedMinutes * 1; // 1 kcal per minute

        const totalCals = activeCals + restCals;

        document.getElementById('distText').innerText = distance.toFixed(2);
        document.getElementById('calText').innerText = Math.round(totalCals);
    }

    btn.addEventListener('click', () => {
        if (!isTracking) {
            isTracking = true;
            btn.innerText = "PARAR";
            btn.className = "stop";
            weightInput.disabled = true;
            
            // Capture the exact moment we start
            startTime = Date.now();
            distance = 0;

            // GPS TRACKING
            watchId = navigator.geolocation.watchPosition(p => {
                const { latitude, longitude } = p.coords;
                if (lastPos) {
                   const d = getDistance(lastPos.lat, lastPos.lon, latitude, longitude);
                   if (d > 0.003) { // 3 meters threshold
                       distance += d;
                       updateStats();
                   }
                }
                lastPos = { lat: latitude, lon: longitude };
            }, e => alert("Activa el GPS"), { enableHighAccuracy: true });

            // UI REFRESH TIMER (Updates every second)
            timerId = setInterval(() => {
                const now = Date.now();
                const diff = now - startTime;
                
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                
                document.getElementById('timeText').innerText = `${h}:${m}:${s}`;
                
                // Update calories every second based on current time
                updateStats();
            }, 1000);

        } else {
            isTracking = false;
            btn.innerText = "EMPEZAR";
            btn.className = "start";
            weightInput.disabled = false;
            navigator.geolocation.clearWatch(watchId);
            clearInterval(timerId);
            lastPos = null;
        }
    });


</script>
<script>
