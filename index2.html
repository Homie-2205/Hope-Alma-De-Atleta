<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompe los Límites</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.container{
    width:100%;
    max-width:430px;
    height:100vh;
    position:relative;
    overflow:hidden;
}

.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(0.45);
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.4),
        rgba(0,0,0,.2),
        rgba(0,0,0,.7)
    );
}

.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:30px 20px;
}

.top{
    text-align:center;
}

.top h2{
    color:white;
    font-size:16px;
    margin-bottom:15px;
}

.languages{
    display:flex;
    gap:10px;
    justify-content:center;
}

.lang{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    color:white;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    min-width:95px;
}

.lang.active{
    background:#ff8c00;
}

.center{
    text-align:center;
}

.center h1{
    color:#ff9f2e;
    font-size:48px;
    font-weight:bold;
    text-shadow:0 0 20px rgba(255,140,0,.6);
}

.center h1 span{
    color:white;
}

.start-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:50px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#ff7a00,#ffb347);
    color:white;
    box-shadow:0 0 20px rgba(255,140,0,.6);
}
</style>
</head>

<body>

<div class="container">

    <!-- Reemplaza avatar.jpg por tu imagen -->
    <img src="avatar.jpg" class="bg">

    <div class="overlay"></div>

    <div class="content">

        <div class="top">
            <h2>Selecciona tu idioma</h2>

            <div class="languages">
                <button class="lang active">🇪🇸 Español</button>
                <button class="lang">🇺🇸 English</button>
                <button class="lang">🇫🇷 Français</button>
            </div>
        </div>

        <div class="center">
            <h1>ROMPE<br><span>LOS</span><br>LÍMITES</h1>
        </div>

        <button class="start-btn">
            EMPEZAR →
        </button>

    </div>

</div>

<script>
const langs = document.querySelectorAll('.lang');

langs.forEach(btn=>{
    btn.addEventListener('click',()=>{
        langs.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
    });
});

document.querySelector('.start-btn')
.addEventListener('click',()=>{
    alert('Bienvenido');
    // window.location.href = "home.html";
});
</script>

</body>
</html>
