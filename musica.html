<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Music Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif}
.app{min-height:100vh;padding:28px 18px;max-width:600px;margin:auto}
h1{text-align:center;font-size:28px;margin:5px 0 25px}.cover{width:220px;height:220px;margin:10px auto 22px;border-radius:22px;
background:linear-gradient(135deg,#27272a,#52525b);display:flex;align-items:center;justify-content:center;font-size:80px;
box-shadow:0 15px 40px #0008}.title{text-align:center;font-size:21px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{text-align:center;color:#a1a1aa;margin-top:7px}.bar{margin-top:25px}input[type=range]{width:100%}.times{display:flex;justify-content:space-between;color:#a1a1aa;font-size:12px}
.controls{display:flex;justify-content:center;align-items:center;gap:22px;margin:25px 0}.btn{border:0;background:#27272a;color:#fff;border-radius:50%;
width:52px;height:52px;font-size:21px}.play{width:68px;height:68px;background:#fff;color:#09090b;font-size:28px}
.action{width:100%;padding:14px;border:0;border-radius:12px;background:#27272a;color:#fff;font-size:16px;margin-bottom:12px}
.playlist{margin-top:20px}.song{padding:14px;border-bottom:1px solid #27272a;cursor:pointer}.song small{color:#a1a1aa}
#file{display:none}
</style>
</head>
<body>
<div class="app">
<h1>🎵 Music Player</h1>
<div class="cover">♫</div>
<div class="title" id="title">No song selected</div>
<div class="artist">WebView Music Player</div>
<div class="bar">
<input id="progress" type="range" min="0" max="100" value="0">
<div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
</div>
<div class="controls">
<button class="btn" onclick="previous()">⏮</button>
<button class="btn play" id="play" onclick="toggle()">▶</button>
<button class="btn" onclick="next()">⏭</button>
</div>
<button class="action" onclick="chooseMusic()">📁 Add music from phone</button>
<input id="file" type="file" accept="audio/*" multiple>
<div class="playlist" id="playlist"></div>
</div>

<script>
let songs=[], index=-1, playing=false, audio=new Audio();

function chooseMusic(){
  if(window.Android){ Android.requestPermission(); }
  document.getElementById('file').click();
}
document.getElementById('file').onchange=e=>{
  songs=[...e.target.files].map(f=>({file:f,url:URL.createObjectURL(f),name:f.name}));
  render(); if(songs.length) load(0);
};
function render(){
  playlist.innerHTML=songs.map((s,i)=>`<div class="song" onclick="load(${i})">🎵 ${escapeHtml(s.name)}<br><small>Tap to play</small></div>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(i){
  if(!songs[i])return; index=i; title.textContent=songs[i].name; audio.src=songs[i].url; audio.load(); audio.play();
  playing=true; play.textContent='⏸';
  // Native Media3 is used for URI playback when explicitly requested from Android.
  if(window.Android) Android.play(songs[i].url,songs[i].name);
}
function toggle(){
 if(index<0){chooseMusic();return}
 if(playing){audio.pause(); if(window.Android)Android.pause();play.textContent='▶';playing=false}
 else{audio.play();if(window.Android)Android.resume();play.textContent='⏸';playing=true}
}
function previous(){if(index>0)load(index-1)}
function next(){if(index<songs.length-1)load(index+1)}
audio.ontimeupdate=()=>{
 if(audio.duration){progress.value=audio.currentTime/audio.duration*100}
 current.textContent=time(audio.currentTime);duration.textContent=time(audio.duration)
}
progress.oninput=()=>{if(audio.duration){let s=progress.value/100*audio.duration;audio.currentTime=s;if(window.Android)Android.seek(s)}}
audio.onended=()=>next();
function time(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
window.onAndroidPermission=granted=>{
 if(!granted) alert('Storage/audio permission was denied.');
}
window.androidReady=()=>{};
</script>
</body>
</html>
