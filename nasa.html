    <h2 id="title">Loading NASA Space Data...</h2>
    <p id="date"></p>
    <div id="media-container"></div>
    <p id="explanation"></p>
<h2>Hola</h2>
    <script>
        // NASA provides a free 'DEMO_KEY' for testing so you can start immediately
        const NASA_URL = "https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY";

        async function getNasaData() {
            try {
                // Fetch data from NASA's servers
                const response = await fetch(NASA_URL);
                const data = await response.json();

                // Inject the API data directly into our HTML elements
                document.getElementById('title').textContent = data.title;
                document.getElementById('date').textContent = data.date;
                document.getElementById('explanation').textContent = data.explanation;

                // Handle both images and videos (sometimes NASA shares YouTube clips)
                const container = document.getElementById('media-container');
                if (data.media_type === 'image') {
                    container.innerHTML = `<img src="${data.url}" alt="${data.title}">`;
                } else if (data.media_type === 'video') {
                    container.innerHTML = `<iframe width="560" height="315" src="${data.url}" frameborder="0" allowfullscreen></iframe>`;
                }

            } catch (error) {
                console.error("Error retrieving NASA API data:", error);
                document.getElementById('title').textContent = "Failed to load space data.";
            }
        }

        // Run the function when the page loads
        getNasaData();
    </script>
