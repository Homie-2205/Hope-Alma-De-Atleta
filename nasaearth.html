<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NASA Earth Example Pacifico Colombiano</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #canvasOne { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvasOne" width="1024" height="768">
        Your browser does not support HTML5 Canvas.
    </canvas>

    <!-- NASA Web WorldWind Library -->
    <script src="https://files.worldwind.arc.nasa.gov/artifactory/web/0.11.0/worldwind.min.js" type="text/javascript"></script>
    
    <script>
        // Create the 3D globe
        var wwd = new WorldWind.WorldWindow("canvasOne");

        // Add Earth image layers and controls
        wwd.addLayer(new WorldWind.BMNGOneImageLayer());
        wwd.addLayer(new WorldWind.BMNGLandsatLayer());
        wwd.addLayer(new WorldWind.CompassLayer());
        wwd.addLayer(new WorldWind.CoordinatesDisplayLayer(wwd));
        wwd.addLayer(new WorldWind.ViewControlsLayer(wwd));
    </script>
</body>
</html>
