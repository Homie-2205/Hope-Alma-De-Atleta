<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Voz</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
    transition:0.5s;
}

#box{
    width:320px;
    min-height:220px;
    background:#555;
    color:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    font-size:24px;
}

button{
    position:fixed;
    top:20px;
    left:20px;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="start">🎤 Iniciar Asistente</button>

<div id="box">
Presiona Iniciar<br>Luego habla...
</div>

<script>



// 1. Configuración de API e Inicialización
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    alert("El reconocimiento de voz no es compatible con este navegador.");
}

const recognition = new SpeechRecognition();
recognition.lang = "es-ES";
recognition.continuous = true;
recognition.interimResults = false;

// 2. Elementos del DOM
const box = document.getElementById("box");
const startBtn = document.getElementById("start");

// 3. Funciones Auxiliares
function speak(message) {
    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = "es-ES";
    speech.rate = 1;
    speech.pitch = 1;
    window.speechSynthesis.speak(speech);
}

function obtenerFechaActual() {
    return new Date().toLocaleDateString('es-ES', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    });
}

function obtenerHoraActual() {
    return new Date().toLocaleTimeString('es-ES');
}

// 4. Diccionario de Comandos (Configuración de Respuestas)
const comandos = [
    {
        activadores: ["hola"],
        accion: () => {
            box.style.background = "orange";
            box.innerHTML = "¡Hola Humano!";
            speak("¡Hola! Un placer conocerte.");
        }
    },
    {
        activadores: ["buenos días"],
        accion: () => {
            box.style.background = "green";
            box.innerHTML = "¡Buenos Días!";
            speak("Buenos días. Espero que tengas un día maravilloso.");
        }
    },
    {
        activadores: ["adiós", "chao"],
        accion: () => {
            box.style.background = "black";
            box.innerHTML = "¡Adiós!";
            speak("Adiós. Nos vemos luego.");
        }
    },
    {
        activadores: ["rojo"],
        accion: () => {
            document.body.style.background = "red";
            speak("Cambiando el fondo a rojo.");
        }
    },
    {
        activadores: ["verde"],
        accion: () => {
            document.body.style.background = "green";
            speak("Cambiando el fondo a verde.");
        }
    },
    {
        activadores: ["azul"],
        accion: () => {
            document.body.style.background = "blue";
            speak("Cambiando el fondo a azul.");
        }
    },
    {
        activadores: ["blanco"],
        accion: () => {
            document.body.style.background = "white";
            speak("Cambiando el fondo a blanco.");
        }
    },
    {
        activadores: ["cuál es la fecha", "fecha de hoy", "qué día es hoy", "que fecha es hoy"],
        accion: () => {
            const fecha = obtenerFechaActual();
            box.innerHTML = fecha;
            speak("Hoy es " + fecha);
        }
    },
    {
        activadores: ["qué hora es"],
        accion: () => {
            const hora = obtenerHoraActual();
            box.innerHTML = hora;
            speak("La hora es " + hora);
        }
    },
    {
        activadores: ["cómo estás alma de atleta"],
        accion: () => {
            box.innerHTML = "¡Estoy excelente!";
            speak("Estoy excelente");
        }
    },
    {
        activadores: ["cómo estás"],
        accion: () => {
            box.innerHTML = "¡Estoy excelente!";
            speak("Estoy excelente. Gracias por preguntar.");
        }
    },
    {
        activadores: ["cómo te llamas", "cual es tu nombre"],
        accion: () => {
            box.innerHTML = "¡Mi nombre es alma de atleta!";
            speak("Mi nombre es alma de atleta.");
        }
    },
    {
        activadores: ["quien te creo", "quien es tu creador"],
        accion: () => {
            box.innerHTML = "¡Mi creador es Cristian Arcos el ambientalista de la bicicleta!";
            speak("Mi creador es Cristian Arcos el ambientalista de la bicicleta");
        }
    },
    {
        activadores: ["de dónde viene el café"],
        accion: () => {
            box.innerHTML = "El café viene de Etiopía en África";
            speak("El café es originario de Etiopía en África.");
        }
    },
    {
        activadores: ["gracias"],
        accion: () => {
            box.innerHTML = "¡De nada!";
            speak("De nada.");
        }
    },
    {
        activadores: ["limpiar", "borrar"],
        accion: () => {
            document.body.style.background = "white";
            box.style.background = "#555";
            box.innerHTML = "Listo para tu siguiente comando.";
            speak("Pantalla limpia.");
        }
    }
];

// 5. Control de Eventos de Voz
if (startBtn) {
    startBtn.onclick = () => recognition.start();
}

recognition.onend = () => recognition.start();

recognition.onerror = (e) => console.error("Error de reconocimiento:", e);

recognition.onresult = (event) => {
    const text = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
    box.innerHTML = text;

    // Busca si el texto coincide con algún activador del diccionario
    const comandoEncontrado = comandos.find(comando => 
        comando.activadores.some(activador => text.includes(activador))
    );

    if (comandoEncontrado) {
        comandoEncontrado.accion();
    } else {
        speak("Lo siento, todavía no conozco ese comando.");
    }
};


</script>

</body>
</html>
