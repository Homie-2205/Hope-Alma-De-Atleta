<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Voz</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
    transition:0.5s;
}

#box{
    width:320px;
    min-height:220px;
    background:#555;
    color:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    font-size:24px;
}

button{
    position:fixed;
    top:20px;
    left:20px;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="start">🎤 Iniciar Asistente</button>

<div id="box">
Presiona Iniciar<br>Luego habla...
</div>

<script>

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
    alert("El reconocimiento de voz no es compatible con este navegador.");
}

const recognition = new SpeechRecognition();

// Cambiado a español
recognition.lang = "es-ES";
recognition.continuous = true;
recognition.interimResults = false;

const box = document.getElementById("box");

function speak(message){
    const speech = new SpeechSynthesisUtterance(message);
    // Cambiado a español
    speech.lang = "es-ES";
    speech.rate = 1;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

document.getElementById("start").onclick = function(){
    recognition.start();
};

recognition.onend = function(){
    recognition.start();
};

recognition.onresult = function(event){

    let text = event.results[event.results.length-1][0].transcript.toLowerCase();

    box.innerHTML = text;

    if(text.includes("hola")){
        box.style.background="orange";
        box.innerHTML="¡Hola Humano!";
        speak("¡Hola! Un placer conocerte.");
    }

    else if(text.includes("buenos días")){
        box.style.background="green";
        box.innerHTML="¡Buenos Días!";
        speak("Buenos días. Espero que tengas un día maravilloso.");
    }

    else if(text.includes("adiós") || text.includes("chao")){
        box.style.background="black";
        box.innerHTML="¡Adiós!";
        speak("Adiós. Nos vemos luego.");
    }

    else if(text.includes("rojo")){
        document.body.style.background="red";
        speak("Cambiando el fondo a rojo.");
    }

    else if(text.includes("verde")){
        document.body.style.background="green";
        speak("Cambiando el fondo a verde.");
    }

    else if(text.includes("azul")){
        document.body.style.background="blue";
        speak("Cambiando el fondo a azul.");
    }

    else if(text.includes("blanco")){
        document.body.style.background="white";
        speak("Cambiando el fondo a blanco.");
    }

    else if(text.includes("cuál es la fecha") || text.includes("fecha de hoy") || text.includes("qué día es hoy")){
        let today = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        box.innerHTML = today;
        speak("Hoy es " + today);
    }
           else if(text.includes("que fecha es hoy") || text.includes("fecha de hoy") || text.includes("qué día es hoy")){
        let today = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        box.innerHTML = today;
        speak("Hoy es " + today);
    }

    else if(text.includes("qué hora es")){
        let time = new Date().toLocaleTimeString('es-ES');
        box.innerHTML = time;
        speak("La hora es " + time);
    }

    else if(text.includes("cómo estás")){
        box.innerHTML="¡Estoy excelente!";
        speak("Estoy excelente. Gracias por preguntar.");
    }

         else if(text.includes("cómo estás alma de atleta")){
        box.innerHTML="¡Estoy excelente!";
        speak("Estoy excelente");
    }


              else if(text.includes("cómo te llamas")){
        box.innerHTML="¡Mi nombre es alma de atleta!";
        speak("Mi nombre es alma de atleta.");
    }

                     else if(text.includes("cual es tu nombre")){
        box.innerHTML="¡Mi nombre es alma de atleta!";
        speak("Mi nombre es alma de atleta.");
    }

                           else if(text.includes("Quien te creo")){
        box.innerHTML="¡Mi creador es Cristian Arcos el ambientalista de la bicicleta!";
        speak("Mi creador es Cristian Arcos el ambientalista de la bicicleta");
    }


                                else if(text.includes("Quien es tu creador")){
        box.innerHTML="¡Mi creador es Cristian Arcos el ambientalista de la bicicleta!";
        speak("Mi creador es Cristian Arcos el ambientalista de la bicicleta");
    }

                                    
    else if(text.includes("de dónde viene el café")){
        box.innerHTML="El café viene de Etiopía en África";
        speak("El café es originario de Etiopía en África.");
    }

    else if(text.includes("gracias")){
        box.innerHTML="¡De nada!";
        speak("De nada.");
    }

    else if(text.includes("limpiar") || text.includes("borrar")){
        document.body.style.background="white";
        box.style.background="#555";
        box.innerHTML="Listo para tu siguiente comando.";
        speak("Pantalla limpia.");
    }

    else{
        speak("Lo siento, todavía no conozco ese comando.");
    }

};

recognition.onerror = function(e){
    console.log(e);
};

</script>

</body>
</html>
