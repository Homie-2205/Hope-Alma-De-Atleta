
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Sky Navigation</title>
<style>
  /* Reset and Fullscreen Layout */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Rich Sky Gradient Background */
    background: linear-gradient(to bottom, #1b4965, #62b6cb);
    position: relative;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Base Cloud Container */
  .cloud-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  /* CSS Generated White Clouds */
  .cloud {
    position: absolute;
    background: #ffffff;
    width: 200px;
    height: 60px;
    border-radius: 200px;
    opacity: 0.85;
  }

  /* Cloud bumps created using pseudo-elements */
  .cloud:before, .cloud:after {
    content: '';
    position: absolute;
    background: #ffffff;
    width: 100px;
    height: 100px;
    position: absolute;
    top: -50px;
    left: 30px;
    border-radius: 100px;
  }

  .cloud:after {
    width: 120px;
    height: 120px;
    top: -70px;
    left: auto;
    right: 25px;
  }

  /* Individual Cloud Positions & Infinite Loop Animations */
  .c1 {
    top: 15%;
    left: -250px;
    transform: scale(0.6);
    opacity: 0.6;
    animation: drift 35s linear infinite;
  }

  .c2 {
    top: 45%;
    left: -250px;
    transform: scale(0.9);
    opacity: 0.75;
    animation: drift 25s linear infinite;
    animation-delay: -10s; /* Offsets starting position */
  }

  .c3 {
    top: 70%;
    left: -250px;
    transform: scale(0.5);
    opacity: 0.5;
    animation: drift 45s linear infinite;
    animation-delay: -5s;
  }

  @keyframes drift {
    0% { left: -250px; }
    100% { left: 100vw; }
  }

  /* Strong, Modern GPS Button */
  .gps-btn {
    position: relative;
    z-index: 10; /* Ensures the button sits cleanly in front of the clouds */
    background-color: #007bff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 16px 32px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25), 0 0 15px rgba(0, 123, 255, 0.4);
    transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
  }

  .gps-btn:hover {
    background-color: #0056b3;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 25px rgba(0, 123, 255, 0.6);
  }

  .gps-btn:active {
    transform: scale(0.97);
  }


  

        .nav-links li {
            margin-right: 1.5rem;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
            margin-right: 1.5rem;
        }
        .nav-links a:hover {
            color: #00adb5;
        }

        /* 2. Header */
        .hero-header {
        background-image: url("I.gif");
            text-align: center;
            padding: 4rem 2rem;
            border-bottom: 1px solid #ddd;
             background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    margin: 0;
    height: 60vh;
        }
        .hero-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #222;
        }

.lang-link {
  color: #334155;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  display: inline-flex; /* Mantiene el link compacto e interno */
  align-items: center; /* Corrección: "center" alinea el icono con el texto */
  gap: 0.3rem;
  padding: 0.3rem 0.6rem;
  border-radius: 0.375rem;
  transition: all 0.2s ease;
}

        /* 3. Main Div Container */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 4. Photos Section */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .photo-gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .lang-list {
  display: flex;
  list-style: none;               
  margin: 0 0 0 3rem; /* Added left margin to space it from the label */
  padding: 0;
  gap: 1rem;          /* Spacing between language choices */
}
        .custom-button {
  /* Layout & Sizing */
  display: inline-block;
  padding: 12px 24px;

  /* Typography */
  font-family: 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  text-align: center;

  /* Colors & Borders */
  color: #1a1100;
  background-color: #ffd480;
  border: none;
  border-radius: 8px;

  /* Interactivity & Performance */
  cursor: pointer;
  user-select: none;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

/* Hover State: When the mouse pointer sits over the button */
.custom-button:hover {
  background-color: #005ce6;
}

/* Active State: When the button is being clicked */
.custom-button:active {
  transform: scale(0.98);
}

/* Focus State: When navigating via keyboard for web accessibility */
.custom-button:focus-visible {
  outline: 3px solid #80bfff;
  outline-offset: 2px;
}

</style>
</head>
<body>
