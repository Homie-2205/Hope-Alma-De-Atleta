<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Run Tracker</title>
    <!-- Cargamos Font Awesome para los iconos vectoriales -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('Canada.jpeg');
            background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
            background-repeat: no-repeat;
            color: black;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;  
            box-sizing: border-box;
            --accent: #ff0000;
        }

        h2 {
            font-family: Georgia, sans-serif;
            color: yellow;
            font-size: 27px;
            text-shadow: -1px -1px 0 #000;
            -webkit-text-stroke: 1px black; 
            margin: 10px 0 20px 0;
        }

        /* Contenedor para alinear la lista a la izquierda */
        .menu-list {
            text-align: left;
            padding-left: 15px;
        }

        /* Bloque individual de cada enlace */
        .menu-item {
            margin: 15px 0;
            display: flex;
            align-items: center;
        }

        /* Estilo para los iconos */
        .menu-item i {
            color: yellow;
            font-size: 22px;
            width: 35px; /* Ancho fijo para mantener los textos alineados */
            text-shadow: -1px -1px 0 #000;
            -webkit-text-stroke: 1px black;
            transition: all 0.3s ease;
        }

        a {
            font-family: Georgia, serif;
            font-size: 22px;
            color: yellow;
            text-decoration: none;
            transition: all 0.3s ease; 
            -webkit-text-stroke: 1px black; 
            display: inline-block;
        }

        /* Efecto Hover unificado para Icono + Texto */
        .menu-item:hover a {
            font-family: "Courier New", Georgia, serif; 
            font-size: 24px;                     
            color: red;                          
        }

        .menu-item:hover i {
            color: red;
            font-size: 24px;
        }

        .card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            width: 100%;
            max-width: 400px; 
            margin: 10px auto; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border-bottom: 4px solid var(--accent); 
            box-sizing: border-box;
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .input-group label {
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        input { 
            background: rgba(255, 255, 255, 0.7); 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        .stats { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }

        .stat-item { 
            background: rgba(0, 0, 0, 0.6); 
            padding: 15px; 
            border-radius: 10px; 
            color: white;
        }

        .stat-value { 
            font-size: 1.8em; 
            font-weight: bold; 
            display: block; 
            color: #ffff66; 
        }

        .full-width {
            grid-column: span 2;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            transition: 0.3s; 
        }

        .start { background: #00cc44; color: white; }
        .stop { background: #cc0000; color: white; }
    </style>
</head>
<body>
